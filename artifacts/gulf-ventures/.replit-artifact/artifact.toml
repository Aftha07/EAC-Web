kind = "web"
previewPath = "/"
title = "Gulf Ventures Website"
version = "1.0.0"
id = "artifacts/gulf-ventures"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20332

[services.development]
run = "pnpm --filter @workspace/gulf-ventures run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gulf-ventures", "run", "build" ]
serve = "static"
publicDir = "artifacts/gulf-ventures/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20332"
BASE_PATH = "/"
